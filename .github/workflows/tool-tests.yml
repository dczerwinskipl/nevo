# Runs the AI-tool test suite (tools/tests/**) as its own check, distinct
# from the .NET build/test job in dotnet.yml — a change to fingerprints,
# lifecycle transitions, batch execution, recovery, follow-up validation,
# routing, or Markdown tooling must be able to fail CI even when the .NET
# build stays green. Scoped to only run when tools/ (or a directly related
# root file) actually changed — a change with no such paths never needed
# this job's result, so it never blocks on it.

name: AI tool tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tool-tests.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tool-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Some tests (e.g. tools/tests/refactoring-review-findings.test.mjs) exercise
      # the real `gh` CLI against this repo (PR lookups, etc.). Without GH_TOKEN,
      # `gh` fails with an auth error before it ever gets to "no PR found", which
      # tools/lib/github.mjs does not treat as the harmless case.
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install dashboard dependencies
        # tools/dashboard is its own npm project (separate package-lock.json).
        # Some tools/tests/*.test.mjs files exercise dashboard server code
        # (e.g. agent-binding.test.mjs's HTTP test registers a real Fastify
        # instance), so its dependencies (fastify, @fastify/*) must be
        # installed too, not just the root project's.
        run: npm --prefix tools/dashboard ci
      - name: Run tests
        run: |
          set +e
          node --test \
            --test-reporter=dot --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=test-results.tap \
            tools/tests/*.test.mjs
          status=$?
          echo ""
          echo "== Summary =="
          tail -n 8 test-results.tap
          exit $status
      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-tests-tap-log
          path: test-results.tap
      - name: Run dashboard server/UI test suite
        run: npm --prefix tools/dashboard test
      - name: Check generated specs indexes are current
        run: npm run specs:check
      - name: Check generated docs indexes are current
        run: npm run docs:check
