  - id: FU-002
    source_task: codex-provider-adapter-and-registration
    kind: architecture
    severity: non-blocking
    reason: >
      Execution intent (ASK, EDIT, AGENT) and host permission policy are currently
      partially coupled inside provider adapters. A future change should define a
      provider-neutral permission policy such as read-only, workspace plus on-request
      escalation, or full access, then map it independently into each provider. That
      design may also consider allow-once, allow-matching-command-for-session, and deny
      decisions without persisting provider request IDs or making live requests restartable.
    resolver_task: null
    status: open
    resolution: null
