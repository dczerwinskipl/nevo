            spec exactly: agent step start in handleWorkflowStepStart, human
            step start in startHumanStep (covers both CLI and dashboard HTTP
            transport), step completed immediately after ensureUpdateTask
            returns (not gated on its internal recovery branch), and both
            already-completed/completed short-circuits re-attempt emission from
            plan.existingRecord. Durable actor captured once at
            createOperationRecord, read back via record.actor at every
            completion site (never re-read from finishSteps per-call param),
            correctly handling resume-under-different-actor. recordActivity
            failures are swallowed in the producer module so finishStep never
            fails on activity recording errors. All 11 new producer tests, 36
            finish-operation tests, and 40 workflow-cli tests pass; node
            tools/specs.mjs validate passes with 31 changes and no errors. No
            gaps found; no corrective changes required."
