  - id: overlapping-allowed-paths-provenance-attribution
    source_task: ai-assistant-chat-and-runtime-feature-slice
    kind: provenance-attribution-limitation
    severity: non-blocking
    reason: Tasks 05-07 declare identical/overlapping allowed_paths
      (tools/dashboard/src/components/**, hooks/**, lib/**, tests/**).
      self-check now supports --incremental (unions the commit(s) since a task's
      own last review_revision onto its existing changed_paths, instead of
      always re-deriving the full since-baseline_revision range), which fixes
      the general case of a re-check re-absorbing a sibling task's entire
      separate historical implementation. It does NOT fully disambiguate when a
      single later review-fix commit touches multiple sibling tasks' files in
      the SAME commit while those tasks share an identical/overlapping
      allowed_paths glob (e.g. a fix touching both a spec-detail file and an
      ai-chat file in one commit still gets attributed to both tasks, since the
      glob cannot distinguish which file belongs to which task). Full
      disambiguation would require narrowing tasks 05-07's own allowed_paths
      declarations to be properly disjoint per feature slice, which is a
      separate, owner-scoped decision (task 07 in particular legitimately
      touches shared consumer files like task-dialog.tsx outside a clean
      ai-chat/** boundary, so a clean disjoint partition is not mechanical).
      Regression coverage for the fixed general case (A/B/C, review-fix touches
      A and C, B unaffected) lives in tools/tests/provenance.test.mjs.
    resolver_task: null
    status: open
    resolution: null
